<title>Installation solaire</title>
<style>
:root{color-scheme:light;--fond:#f4f3f0;--carte:#fcfcfb;--t1:#0b0b0b;--t2:#52514e;--trait:#e1e0d9;--acc:#1f4e79;--crit:#d03b3b}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--fond:#0d0d0d;--carte:#1a1a19;--t1:#f0efec;--t2:#c3c2b7;--trait:#2c2c2a;--acc:#86b6ef}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fond);color:var(--t1);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.carte{width:min(380px,100%);background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:22px 22px 18px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 4px}.sous{color:var(--t2);font-size:13px;margin:0 0 18px}
label{display:block;font-size:13px;font-weight:600;color:var(--t2);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border-radius:9px;border:1px solid var(--trait);background:var(--fond);color:var(--t1)}
.case{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--t1);margin:12px 0 16px;font-size:14px}
button{width:100%;font:inherit;font-weight:650;padding:10px;border:0;border-radius:9px;background:var(--acc);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0b0b0b}}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:20px;margin:12px 0 0;font-size:13.5px;color:var(--crit)}#msg.info{color:var(--t2)}
</style></head>

<script>
// La page est chiffrée (AES-256-CTR + HMAC-SHA256, clé tirée du mot de passe par PBKDF2) : elle n'est lisible
// qu'après déchiffrement dans le navigateur. Le mot de passe ne quitte jamais l'appareil.
// Tout est enfermé dans une fonction : la page déchiffrée, écrite dans ce même document, garde ses propres noms.
(() => {
const P = JSON.parse(document.getElementById("paquet").textContent);
const deB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enB64 = u => btoa(String.fromCharCode(...u));
const msg = (t, info) => { const e = document.getElementById("msg"); e.textContent = t; e.className = info ? "info" : ""; };
async function deriver(mdp) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: deB64(P.sel), iterations: P.it}, base, 512));
}
async function ouvrir(cles) {
  const iv = deB64(P.iv), d = deB64(P.d), tout = new Uint8Array(iv.length + d.length); tout.set(iv); tout.set(d, iv.length);
  const kMac = await crypto.subtle.importKey("raw", cles.slice(32), {name: "HMAC", hash: "SHA-256"}, false, ["verify"]);
  if (!await crypto.subtle.verify("HMAC", kMac, deB64(P.mac), tout)) throw new Error("mot de passe");
  const kAes = await crypto.subtle.importKey("raw", cles.slice(0, 32), "AES-CTR", false, ["decrypt"]);
  const clair = await crypto.subtle.decrypt({name: "AES-CTR", counter: iv, length: 64}, kAes, d);
  const html = await new Response(new Blob([clair]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
  document.open(); document.write(html); document.close();
}
(async () => {
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") { msg("Ce navigateur est trop ancien pour ouvrir la page : le mettre à jour."); return; }
  let k = null; try { k = localStorage.getItem("solarmont100.cle"); } catch (e) {}
  if (k) { msg("Ouverture…", true); try { await ouvrir(deB64(k)); return; } catch (e) { try { localStorage.removeItem("solarmont100.cle"); } catch (e2) {} msg(""); } }
  document.getElementById("f").addEventListener("submit", async ev => {
    ev.preventDefault();
    const b = document.getElementById("b"); b.disabled = true; msg("Vérification…", true);
    const retenir = document.getElementById("r").checked;
    try {
      const cles = await deriver(document.getElementById("m").value);
      if (retenir) try { localStorage.setItem("solarmont100.cle", enB64(cles)); } catch (e) {}
      await ouvrir(cles);   // remplace la page de connexion par la page déchiffrée
    } catch (e) {
      try { localStorage.removeItem("solarmont100.cle"); } catch (e2) {}
      b.disabled = false; msg(e.message === "mot de passe" ? "Mot de passe incorrect." : "Impossible d'ouvrir la page : " + e.message);
    }
  });
})();
})();
</script></body></html>
